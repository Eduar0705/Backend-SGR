version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sgr_backend
    restart: always
    ports:
      - "3007:3000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sgr_net

  db:
    image: mysql:8.0
    container_name: sgr_mysql
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: sistems_sgr
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sgr_net

volumes:
  mysql_data:

networks:
  sgr_net:
    driver: bridge